apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-testuser
  namespace: default
rules:
- apiGroups:
    - argoproj.io
    - ""
  resources:
    - clusterworkflowtemplates
    - cronworkflows
    - eventsources
    - sensors
    - workflows
    - workfloweventbindings
    - workflowtemplates
    - workflowtaskresults
    - pods
  verbs:
    - get
    - watch
    - list
    - create
    - delete
    - update
