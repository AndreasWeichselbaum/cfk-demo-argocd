apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
data:
  artifactRepository: |
    archiveLogs: true
    s3:
      endpoint: argo-artifacts:9000
      bucket: my-bucket
      insecure: true
      accessKeySecret:
        name: argo-artifacts
        key: rootUser
      secretKeySecret:
        name: argo-artifacts
        key: rootPassword
